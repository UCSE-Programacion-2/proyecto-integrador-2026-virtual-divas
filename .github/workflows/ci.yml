name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/frontend-react/package-lock.json
      - run: npm ci
      - run: npm run lint:js
      - run: npm run build
        env:
          VITE_API_URL: https://pintunort-api.onrender.com/api
